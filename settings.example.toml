# Debrief settings. Copy this file to settings.toml and fill in your token.
# Keep settings.toml private: it holds your Garage 61 token. Never share it or post it.

# Your personal access token from https://garage61.net/developer (the developer app you set up there).
token = "PASTE-YOUR-GARAGE61-TOKEN-HERE"

# Where reviews are saved. Leave as-is for Documents\Debrief Reviews.
library_folder = "~/Documents/Debrief Reviews"
# To use another folder, put the path in single quotes, e.g.  library_folder = 'D:\Racing\Reviews'

# How many comparison laps to pull (from teammates and drivers you follow). Max 3.
max_reference_laps = 3

# Also review practice and qualifying sessions, not just races.
include_practice = false

# History sync: Debrief keeps a copy of all your Garage 61 laps (races, qualifying and practice).
# The first sync downloads everything; after that each sync only asks for new laps.
# sync_on_open: catch up automatically each time Debrief opens.
# sync_telemetry: "best" also saves telemetry for your best lap of every session; "none" skips it.
sync_on_open = true
sync_telemetry = "best"

# Check GitHub for a newer Debrief once a day (one request; nothing about you is sent).
check_updates = true

# How reviews address you, e.g. "sir" (up to 20 characters). Leave empty for none.
salutation = ""

# Your Garage 61 team, for the Team hub and Prep pages. Pick it in Settings > Team, or type its
# short name from the team's Garage 61 web address.
team_slug = "midfield-menace"

# OPTIONAL: iRacing data API credentials. iRacing only issues these on request, and nothing in
# Debrief needs them today. If iRacing gives you a client ID and secret, paste them in
# Settings > iRacing (optional) instead of here. Keep them private, like the token.
# iracing_client_id = ""
# iracing_client_secret = ""

# Team track cards (2.4): a folder your team shares (OneDrive, Google Drive, Dropbox...). Debrief reads
# teammates' track cards from "<folder>\Debrief track cards". It writes only your own file there, and only
# when share_my_cards is true.
# team_cards_folder = "D:\\OneDrive\\Menace"
# share_my_cards = false
