  x.fillStyle = '#fff'; x.font = 'bold 60px sans-serif'; x.fillText('Charlotte Roval', 60, 300);
  parent.postMessage({type: "debrief:share-card", id: m.id, error: "draw failed"}, "*"); return;
  parent.postMessage({type: 'debrief:share-card', id: 'not-' + m.id, png: png, text: 'DECOY'}, '*');
  parent.postMessage({type: 'debrief:share-card', id: m.id, png: png,
                      text: 'Alex Driver · Roval · Mustang GT4: best 1:25.612, P7 from P9'}, '*');
});
