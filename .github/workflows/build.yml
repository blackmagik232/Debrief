# Builds the Debrief Windows installer.
#  * every push / pull request / manual run: tests, PyInstaller build, smoke tests, installer artifact
#  * a new version on main, or a tag like v2.0.0: the separate "release" job signs the installer (when the
#    DEBRIEF_SIGNING_KEY secret is set) and publishes a GitHub Release with
#    Debrief-Setup-<version>.exe, .exe.sha256 and .exe.sig attached.
#
# Security: the build job can only read the repository (it runs third-party build tools). Only the release
# job can write, and it only downloads the built installer, signs it and publishes it. Give the "release"
# environment required reviewers in Settings > Environments so every release needs a manual OK, and keep
# DEBRIEF_SIGNING_KEY as a secret of that environment only.
# Actions are pinned to version tags. TODO(owner): pin each to its full commit SHA (look them up on the
# actions' release pages; this was prepared offline, so the SHAs couldn't be checked).
name: Build Windows installer

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false   # no token left in .git/config for build tools to find

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt pyinstaller==6.22.3

      - name: Read version
        id: ver
        run: |
          $v = (python -c "import debrief; print(debrief.__version__)").Trim()
          if ($LASTEXITCODE -ne 0 -or -not $v) { throw "Couldn't read __version__ from debrief/__init__.py" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Debrief version $v"
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "Tag $env:GITHUB_REF_NAME doesn't match __version__ $v (expected v$v)"
          }

      # Tests that need the mock Garage 61 data or Playwright print SKIPPED here (neither is on the runner).
      - name: Test analysis
        run: python tests/test_analysis.py
      - name: Test library
        run: python tests/test_library.py
      - name: Test desktop
        run: python tests/test_desktop.py
      - name: Test history sync
        run: python tests/test_sync.py
      - name: Test Prepare page
        run: python tests/test_prepare.py
      - name: Test updater
        run: python tests/test_updater.py
      - name: Test coaching summary
        run: python tests/test_insights.py
      - name: Test fixes (server, security, updater)
        run: python tests/test_fix_c.py
      - name: Test fixes (analysis)
        run: python tests/test_fix_a.py
      - name: Test fixes (data)
        run: python tests/test_fix_b.py
      - name: Test fixes (UI)
        run: python tests/test_fix_d.py
      - name: Test integration (2.2.2)
        run: python tests/test_integration.py
      - name: Test name matching
        run: python tests/test_match_aliases.py
      - name: Test 2.3.0 fixes
        run: python tests/test_230_fixes.py
      - name: Test technique detail (2.3)
        run: python tests/test_23_a.py
      - name: Test skills, sessions and profile (2.3)
        run: python tests/test_23_b.py
      - name: Test review and library pages (2.3)
        run: python tests/test_23_c.py
      - name: Test shell (2.3)
        run: python tests/test_23_d.py

      - name: Build with PyInstaller
        run: pyinstaller packaging/debrief.spec --noconfirm --clean

      - name: Smoke test the built app
        run: |
          $data = Join-Path $env:LOCALAPPDATA "Debrief"
          Remove-Item (Join-Path $data "selftest.json") -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath "dist\Debrief\Debrief.exe" -ArgumentList "--selftest" -PassThru
          $finished = $p.WaitForExit(180000)
          if (-not $finished) { Stop-Process -Id $p.Id -Force }
          $hang = Join-Path $data "selftest-hang.txt"
          $log = Join-Path $data "debrief.log"
          $timedOut = (Test-Path $hang) -and (Select-String -Path $hang -Pattern "Timeout" -Quiet)
          if ((-not $finished) -or $timedOut) {
            $t = if (Test-Path $hang) { (Get-Content $hang -Raw) -replace "`r?`n", " | " } else { "no hang file" }
            Write-Host "::error title=selftest hang (stacks)::$t"
            if (Test-Path $log) { $l = ((Get-Content $log -Tail 25) -join " | "); Write-Host "::error title=selftest hang (log)::$l" }
            Get-Process | Where-Object { $_.ProcessName -match "Debrief|msedge" } | ForEach-Object { Write-Host "::error title=process::$($_.ProcessName) $($_.Id)" }
            throw "selftest hung"
          }
          $json = Join-Path $data "selftest.json"
          if (Test-Path $json) { Get-Content $json } else { Write-Host "selftest.json is missing" }
          if (Test-Path (Join-Path $data "debrief.log")) { Get-Content (Join-Path $data "debrief.log") -Tail 40 }
          if ($p.ExitCode -ne 0) { throw "Debrief.exe --selftest exited with $($p.ExitCode)" }
          $r = Get-Content $json -Raw | ConvertFrom-Json
          if (-not $r.ok -or -not $r.frozen) { throw "selftest.json doesn't report ok/frozen" }
          if (-not (Test-Path (Join-Path $data "settings.toml"))) { throw "first start didn't create settings.toml" }

      - name: Install Inno Setup if needed
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $known = "${env:ProgramFiles(x86)}\Inno Setup 6"
            if (Test-Path "$known\ISCC.exe") {
              Write-Host "Inno Setup found at $known"
            } else {
              choco install innosetup -y --no-progress
            }
            "${env:ProgramFiles(x86)}\Inno Setup 6" >> $env:GITHUB_PATH
          }

      - name: Build installer
        run: |
          iscc /DAppVersion=${{ steps.ver.outputs.version }} packaging\debrief.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed ($LASTEXITCODE)" }
          Get-Item "dist-installer\Debrief-Setup-${{ steps.ver.outputs.version }}.exe"

      - name: Upgrade test (previous release -> this build, the way the in-app updater does it)
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $setup = Resolve-Path "dist-installer\Debrief-Setup-$v.exe"
          $app = Join-Path $env:LOCALAPPDATA "Programs\Debrief"
          $exe = Join-Path $app "Debrief.exe"
          # the newest published release (public download, no token)
          $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/latest" -Headers @{ "User-Agent" = "debrief-ci" }
          $asset = $rel.assets | Where-Object { $_.name -match '^Debrief-Setup-[\d.]+\.exe$' } | Select-Object -First 1
          if (-not $asset) { Write-Host "No previous release to upgrade from; skipping."; exit 0 }
          if ($rel.tag_name -eq "v$v") { Write-Host "This version is already released; skipping."; exit 0 }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile old-setup.exe
          $p = Start-Process -FilePath old-setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/CURRENTUSER","/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installing $($rel.tag_name) failed ($($p.ExitCode))" }
          $old = (Get-Item $exe).VersionInfo.FileVersion
          Write-Host "Installed $($rel.tag_name) (exe version '$old')"
          # the old Debrief is running when its updater starts the new installer, then closes ~4 s later
          $running = Start-Process -FilePath $exe -ArgumentList "--no-browser" -PassThru
          Start-Sleep -Seconds 5
          $up = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/CURRENTUSER","/NORESTART","/CLOSEAPPLICATIONS","/RELAUNCH=1","/LOG=upgrade.log" -PassThru
          Start-Sleep -Seconds 4
          Stop-Process -Id $running.Id -Force -ErrorAction SilentlyContinue
          if (-not $up.WaitForExit(240000)) { Stop-Process -Id $up.Id -Force; Get-Content upgrade.log -Tail 40; throw "upgrade installer still running after 4 minutes" }
          if ($up.ExitCode -ne 0) { Get-Content upgrade.log -Tail 40; throw "upgrade installer exited with $($up.ExitCode)" }
          $new = (Get-Item $exe).VersionInfo.FileVersion
          if ($new -ne $v) { Get-Content upgrade.log -Tail 60; throw "after the upgrade Debrief.exe reports version '$new', expected '$v'" }
          if (Test-Path (Join-Path $app "_internal.new")) { throw "the staged files were left behind" }
          Write-Host "Upgraded $($rel.tag_name) -> $v OK"
          Get-Process Debrief -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Process -FilePath (Join-Path $app "unins000.exe") -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }

      - name: Silent install smoke test
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $setup = Resolve-Path "dist-installer\Debrief-Setup-$v.exe"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/CURRENTUSER","/NORESTART","/LOG=install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 40; throw "setup exited with $($p.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA "Programs\Debrief"
          $exe = Join-Path $app "Debrief.exe"
          if (-not (Test-Path $exe)) { Get-Content install.log -Tail 40; throw "Debrief.exe not installed at $exe" }
          $data = Join-Path $env:LOCALAPPDATA "Debrief"
          Remove-Item (Join-Path $data "selftest.json") -ErrorAction SilentlyContinue
          $q = Start-Process -FilePath $exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content (Join-Path $data "selftest.json") -ErrorAction SilentlyContinue
          if ($q.ExitCode -ne 0) { throw "installed Debrief.exe --selftest exited with $($q.ExitCode)" }
          $lnk = Join-Path ([Environment]::GetFolderPath("Programs")) "Debrief.lnk"
          if (-not (Test-Path $lnk)) { throw "Start menu shortcut missing: $lnk" }

          # uninstall: program files go, the user's data stays
          $un = Join-Path $app "unins000.exe"
          Start-Process -FilePath $un -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }   # the uninstaller finishes from a temp copy
          if (Test-Path $exe) { throw "uninstall left Debrief.exe behind" }
          if (-not (Test-Path (Join-Path $data "settings.toml"))) { throw "uninstall removed the user's settings" }
          Write-Host "Install, selftest and uninstall all OK"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Debrief-Setup-${{ steps.ver.outputs.version }}
          path: dist-installer/Debrief-Setup-${{ steps.ver.outputs.version }}.exe
          if-no-files-found: error

  release:
    needs: windows
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write   # this job only: create the release
    steps:
      - name: Check out (signing script only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download the built installer
        uses: actions/download-artifact@v4
        with:
          name: Debrief-Setup-${{ needs.windows.outputs.version }}
          path: dist-installer

      - name: Checksum and signature
        env:
          DEBRIEF_SIGNING_KEY: ${{ secrets.DEBRIEF_SIGNING_KEY }}
        run: |
          set -euo pipefail
          v="${{ needs.windows.outputs.version }}"
          exe="dist-installer/Debrief-Setup-$v.exe"
          test -f "$exe"
          # checksum file for the in-app updater (it refuses to install without a matching SHA-256)
          (cd dist-installer && sha256sum "Debrief-Setup-$v.exe" | tr -d '\n' > "Debrief-Setup-$v.exe.sha256")
          key_set=$(python3 -c "import sys; sys.path.insert(0, '.'); from debrief import updater; print('yes' if updater.RELEASE_PUBLIC_KEY else 'no')")
          if [ -n "${DEBRIEF_SIGNING_KEY:-}" ]; then
            python3 packaging/sign_release.py "$exe"
          elif [ "$key_set" = "yes" ]; then
            echo "::error::debrief/updater.py has RELEASE_PUBLIC_KEY set but the DEBRIEF_SIGNING_KEY secret is missing: installed copies would refuse this release."
            exit 1
          else
            echo "DEBRIEF_SIGNING_KEY isn't set: publishing without a signature (the app accepts that only while RELEASE_PUBLIC_KEY is None)."
          fi
          ls -l dist-installer

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          v="${{ needs.windows.outputs.version }}"
          tag="v$v"
          # one release per version: bump __version__ in debrief/__init__.py to publish a new one
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $tag already exists; nothing to publish."; exit 0
          fi
          files=("dist-installer/Debrief-Setup-$v.exe" "dist-installer/Debrief-Setup-$v.exe.sha256")
          if [ -f "dist-installer/Debrief-Setup-$v.exe.sig" ]; then files+=("dist-installer/Debrief-Setup-$v.exe.sig"); fi
          gh release create "$tag" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Debrief $v" --generate-notes
